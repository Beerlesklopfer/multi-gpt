# Baut zu jedem Versions-Tag (v*) das Debian-Paket auf Debian 13, hängt es an ein
# GitHub-Release und veröffentlicht danach Website samt apt-Repository
# (website.yml). Von Hand: Actions → Paket → "Run workflow" mit dem Tag, z. B. für
# ein Tag, das vor diesem Workflow entstand.
name: Paket

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v0.3.3"
        required: true

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Build-Abhängigkeiten
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates git build-essential debhelper dh-virtualenv \
            python3 python3-dev python3-venv dpkg-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Version prüfen
        run: |
          version=$(dpkg-parsechangelog -S Version)
          [ "v${version}" = "${TAG}" ] || {
            echo "::error::Tag ${TAG} passt nicht zu debian/changelog (${version})"; exit 1; }

      - name: Paket bauen
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist && mv ../multi-gpt_*.deb dist/
          dpkg-deb --info dist/*.deb | sed -n '1,25p'

      - name: Artefakt hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  packaging-tests:
    # postinst/postrm mit Stubs gegen das nginx von Debian 13 (Ubuntu 24.04 hat nur
    # 1.24, das postinst verlangt 1.25.1). nginx -t läuft unter "unshare -rn",
    # deshalb privilegierter Container.
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Abhängigkeiten
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates make dash openssl nginx-light util-linux
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: make test-packaging
        run: make test-packaging

  release:
    needs: [build, packaging-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Artefakt holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${TAG#v}
          # Abschnitt dieser Version aus debian/NEWS (falls vorhanden) und debian/changelog.
          section() { awk -v v="($version)" '$2 == v {on=1; next} /^ -- / && on {exit} on' "$1"; }
          {
            news=$(section debian/NEWS)
            if [ -n "$news" ]; then printf '## Hinweise\n%s\n\n' "$news"; fi
            printf '## Änderungen\n%s\n\n' "$(section debian/changelog)"
            printf 'Installation per apt: https://%s.github.io/%s/installation/\n' \
              "${GITHUB_REPOSITORY_OWNER,,}" "${GITHUB_REPOSITORY#*/}"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb --clobber
          else
            gh release create "$TAG" dist/*.deb --title "MultiGPT ${version}" --notes-file notes.md --verify-tag
          fi

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    secrets: inherit
