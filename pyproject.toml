[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-gpt"
version = "0.2.0"
description = "Lokales Multi-KI-Chatsystem für die Familie"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joerg Bernau", email = "joerg@bernau.family" }]
dependencies = [
    "cryptography>=44",
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-axes>=8.0",
    "gunicorn>=23",
    "httpx>=0.27",
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "whitenoise>=6.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multigpt*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "multigpt.settings"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["debian", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Von Django erzeugte Migrationen enthalten lange help_text-Zeilen.
"*/migrations/*.py" = ["E501"]
