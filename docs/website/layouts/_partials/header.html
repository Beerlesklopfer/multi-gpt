<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <img src="{{ "favicon.svg" | relURL }}" alt="" width="28" height="28">
      <span>MultiGPT</span>
    </a>
    <nav class="main-nav" aria-label="{{ T "main_nav" }}">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        {{- $active := false }}
        {{- with .Page }}{{ $active = eq .RelPermalink $current.RelPermalink }}{{ end }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <nav class="lang-nav" aria-label="{{ T "language_nav" }}">
      <ul>
        {{- range .Translations }}
        <li><a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.Label }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
