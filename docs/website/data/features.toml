# Funktionskacheln der Startseite.
# status: "done" | "partial" | "planned"; milestone verweist auf data/roadmap.toml.

[[items]]
  status = "done"
  milestone = "1"
  [items.title]
    de = "Anmeldung mit Schutz"
    en = "Login with protection"
  [items.text]
    de = "Login, Logout und Passwort ändern. Nach fünf Fehlversuchen wird für 15 Minuten gesperrt. Keine Selbstregistrierung."
    en = "Log in, log out and change password. Five failed attempts lock the login for 15 minutes. No self-registration."

[[items]]
  status = "done"
  milestone = "1"
  [items.title]
    de = "Debian-Paket und systemd"
    en = "Debian package and systemd"
  [items.text]
    de = "Ein `.deb` mit eigenem venv, systemd-Unit und dem Verwaltungsbefehl `mgpt-ctl`. Docker als Ausweichweg. Die Testinstallation auf einem frischen Debian 13 steht noch aus."
    en = "A `.deb` with its own venv, a systemd unit and the `mgpt-ctl` admin command. Docker as a fallback. A test install on a fresh Debian 13 is still pending."

[[items]]
  status = "done"
  milestone = "3 / 4"
  [items.title]
    de = "Ein Chat, viele Anbieter"
    en = "One chat, many providers"
  [items.text]
    de = "OpenAI, Anthropic, Google Gemini, OpenRouter und andere OpenAI-kompatible Dienste über eigene API-Keys. Antworten kommen gestreamt, das Modell lässt sich pro Nachricht wechseln. Mit OpenAI im echten Einsatz, die übrigen Anbieter bisher simuliert getestet."
    en = "OpenAI, Anthropic, Google Gemini, OpenRouter and other OpenAI-compatible services via your own API keys. Answers are streamed, and the model can be switched per message. Running with OpenAI for real; the other providers have been tested with simulations so far."

[[items]]
  status = "done"
  milestone = "4"
  [items.title]
    de = "Lokale Modelle mit LM Studio"
    en = "Local models with LM Studio"
  [items.text]
    de = "LM Studio auf einem PC im Heimnetz als Anbieter. Eine Statusanzeige zeigt, ob er gerade läuft; die geladenen Modelle werden automatisch angeboten. Lokale Modelle kosten nichts. Der Test im echten Heimnetz steht noch aus."
    en = "LM Studio on a PC in your home network as a provider. A status indicator shows whether it is running; its models are offered automatically. Local models cost nothing. A test in a real home network is still pending."

[[items]]
  status = "done"
  milestone = "2"
  [items.title]
    de = "Familienkonten mit Rollen"
    en = "Family accounts with roles"
  [items.text]
    de = "Verwalter, Erwachsene, Jugendliche, Gäste – jede Rolle mit eigenen Modellen und Rechten. Chats bleiben privat."
    en = "Administrators, adults, teenagers, guests – each role with its own models and permissions. Chats stay private."

[[items]]
  status = "planned"
  milestone = "6"
  [items.title]
    de = "Budgets und Verbrauch"
    en = "Budgets and usage"
  [items.text]
    de = "Monatsbudget je Rolle oder Person, Hinweis bei 80 %, Sperre kostenpflichtiger Modelle bei 100 %. Verbrauch nach Person, Modell und Monat."
    en = "Monthly budget per role or person, a warning at 80 %, paid models blocked at 100 %. Usage by person, model and month."

[[items]]
  status = "planned"
  milestone = "6"
  [items.title]
    de = "Vergleichsmodus"
    en = "Comparison mode"
  [items.text]
    de = "Dieselbe Frage an zwei oder drei Modelle gleichzeitig, Antworten nebeneinander."
    en = "Ask two or three models the same question at once and see the answers side by side."

[[items]]
  status = "done"
  milestone = "4a"
  [items.title]
    de = "Werkzeuge über MCP"
    en = "Tools via MCP"
  [items.text]
    de = "Modelle rufen Werkzeuge aus MCP-Servern auf. Heikle Aufrufe brauchen eine Bestätigung im Chat. Jeder Aufruf ist im Chat aufklappbar sichtbar."
    en = "Models call tools from MCP servers. Sensitive calls need a confirmation in the chat. Every call is visible in the chat as an expandable row."

[[items]]
  status = "planned"
  milestone = "7"
  [items.title]
    de = "Fragen an eigene Dokumente"
    en = "Ask your own documents"
  [items.text]
    de = "PDFs und Texte hochladen, Antworten mit Quellen und Seitenzahl. Suche mit PostgreSQL und pgvector."
    en = "Upload PDFs and texts, get answers with sources and page numbers. Search with PostgreSQL and pgvector."

[[items]]
  status = "planned"
  milestone = "8"
  [items.title]
    de = "Websuche mit Quellen"
    en = "Web search with sources"
  [items.text]
    de = "Aktuelle Informationen aus dem Netz, mit Links unter der Antwort – auch für lokale Modelle."
    en = "Current information from the web, with links below the answer – for local models too."

[[items]]
  status = "planned"
  milestone = "9"
  [items.title]
    de = "Bilder erzeugen und bearbeiten"
    en = "Create and edit images"
  [items.text]
    de = "Bilder erzeugen, Bereiche ändern, Varianten, Zuschneiden und Skalieren. Das Original bleibt erhalten."
    en = "Generate images, change marked areas, variations, crop and resize. The original is kept."

[[items]]
