# Funktionskacheln der Startseite.
# status: "done" | "partial" | "progress" | "planned"; milestone verweist auf data/roadmap.toml.
# "progress" = in Arbeit, noch nicht veröffentlicht (derzeit nirgends in Gebrauch).
# Stand: Version 0.4.0

[[items]]
  status = "done"
  milestone = "1"
  [items.title]
    de = "Anmeldung mit Schutz"
    en = "Login with protection"
  [items.text]
    de = "Login, Logout und Passwort ändern. Nach fünf Fehlversuchen wird für 15 Minuten gesperrt. Keine Selbstregistrierung."
    en = "Log in, log out and change password. Five failed attempts lock the login for 15 minutes. No self-registration."

[[items]]
  status = "done"
  milestone = "1"
  [items.title]
    de = "Debian-Paket und systemd"
    en = "Debian package and systemd"
  [items.text]
    de = "Ein `.deb` mit eigenem venv, nginx mit TLS, systemd-Units und dem Verwaltungsbefehl `mgpt-ctl`, aktuell 0.4.0. Seit 0.3.4 über eine signierte apt-Paketquelle für Debian 13, Updates mit `apt upgrade`. Docker als Ausweichweg. Die Testinstallation auf einem frischen Debian 13 steht noch aus."
    en = "A `.deb` with its own venv, nginx with TLS, systemd units and the `mgpt-ctl` admin command, currently 0.4.0. Since 0.3.4 from a signed apt repository for Debian 13, with updates via `apt upgrade`. Docker as a fallback. A test install on a fresh Debian 13 is still pending."

[[items]]
  status = "done"
  milestone = "3 / 4"
  [items.title]
    de = "Ein Chat, viele Anbieter"
    en = "One chat, many providers"
  [items.text]
    de = "OpenAI, Anthropic, Google Gemini, OpenRouter und andere OpenAI-kompatible Dienste über eigene API-Keys. Antworten kommen gestreamt, das Modell lässt sich pro Nachricht wechseln. Nicht erreichbare Anbieter sind ausgegraut, abgelaufene Keys werden klar gemeldet."
    en = "OpenAI, Anthropic, Google Gemini, OpenRouter and other OpenAI-compatible services via your own API keys. Answers are streamed, and the model can be switched per message. Unreachable providers are greyed out, and expired keys are reported clearly."

[[items]]
  status = "done"
  milestone = "4"
  [items.title]
    de = "Lokale Modelle mit LM Studio"
    en = "Local models with LM Studio"
  [items.text]
    de = "LM Studio auf einem PC im Heimnetz als Anbieter. Eine Statusanzeige zeigt, ob er gerade läuft; die Modelle werden samt ihren Fähigkeiten automatisch angeboten. Auf Wunsch lädt und entlädt MultiGPT sie selbst, nie über ein Speicherbudget für die Grafikkarte. Lokale Modelle kosten nichts. Im echten Heimnetz im Einsatz."
    en = "LM Studio on a PC in your home network as a provider. A status indicator shows whether it is running; its models are offered automatically, along with their capabilities. If you like, MultiGPT loads and unloads them itself, never beyond a memory budget for the graphics card. Local models cost nothing. In real use in a home network."

[[items]]
  status = "done"
  milestone = "4 / 4a"
  [items.title]
    de = "Fähigkeiten-Matrix"
    en = "Capability matrix"
  [items.text]
    de = "Je Modell eine Hauptart (Chat, Bild, Embedding …) und Häkchen für Werkzeuge, Bilder verstehen, Bilder bearbeiten und MCP. MultiGPT erkennt sie automatisch; `mgpt-ctl guess_capabilities` holt das für ältere Modelle nach."
    en = "Per model a main type (chat, image, embedding …) plus ticks for tools, image understanding, image editing and MCP. MultiGPT detects them automatically; `mgpt-ctl guess_capabilities` catches up on older models."

[[items]]
  status = "done"
  milestone = "5"
  [items.title]
    de = "Anhänge und Bild-Eingabe"
    en = "Attachments and image input"
  [items.text]
    de = "Bilder und Dokumente einfügen, hineinziehen oder per Büroklammer anhängen. Bilder gehen an Modelle, die sie verstehen; EXIF-Daten wie der Aufnahmeort werden vorher entfernt."
    en = "Paste, drag in or attach images and documents with the paper clip. Images go to models that understand them; EXIF data such as the location is removed first."

[[items]]
  status = "done"
  milestone = "5"
  [items.title]
    de = "Projekte"
    en = "Projects"
  [items.text]
    de = "Chats zu Projekten bündeln, mit gemeinsamen Anweisungen, Standardmodell und vorausgewählten Sammlungen – wie in ChatGPT oder Claude."
    en = "Group chats into projects with shared instructions, a default model and preselected collections – as in ChatGPT or Claude."

[[items]]
  status = "done"
  milestone = "5"
  [items.title]
    de = "Chats teilen"
    en = "Share chats"
  [items.text]
    de = "Einen Chat mit Konten oder Gruppen teilen, mit Rechten nach RWUD: Lesen, Schreiben, Bearbeiten, Löschen. Ein Widerruf wirkt sofort, Kosten trägt, wer sendet. Löscht oder archiviert ein Empfänger etwas, bekommt der Besitzer eine Mitteilung."
    en = "Share a chat with accounts or groups, with RWUD permissions: read, write, update, delete. Revoking takes effect at once, and whoever sends pays. If a recipient deletes or archives something, the owner gets a notice."

[[items]]
  status = "done"
  milestone = "5"
  [items.title]
    de = "Formeln und SVG-Vorschau"
    en = "Formulas and SVG preview"
  [items.text]
    de = "Mathematische Formeln mit KaTeX, selbst gehostet. SVG-Code aus Antworten erscheint als Vorschau – nur als Bild, ohne Skripte und ohne Nachladen."
    en = "Mathematical formulas with KaTeX, self-hosted. SVG code in answers is shown as a preview – as an image only, with no scripts and nothing loaded from outside."

[[items]]
  status = "done"
  milestone = "2"
  [items.title]
    de = "Familienkonten mit Rollen"
    en = "Family accounts with roles"
  [items.text]
    de = "Verwalter, Erwachsene, Jugendliche, Gäste – jede Rolle mit eigenen Modellen und Rechten. Chats bleiben privat."
    en = "Administrators, adults, teenagers, guests – each role with its own models and permissions. Chats stay private."

[[items]]
  status = "done"
  milestone = "6"
  [items.title]
    de = "Kontenrahmen und Budgets"
    en = "Billing accounts and budgets"
  [items.text]
    de = "Jeder Anbieter rechnet über ein Konto ab: in Euro oder Dollar, nur in Tokens (lokal) oder als Pauschale. Preise mit Gültigkeitsdatum, Cache und Reasoning, der EZB-Kurs für Dollar kommt automatisch. Budgets je Konto, Rolle und Person mit Hinweis ab 80 % und Sperre ab 100 %."
    en = "Each provider bills through an account: in euros or dollars, in tokens only (local) or as a flat rate. Prices with a validity date, cache and reasoning; the ECB rate for dollars is fetched automatically. Budgets per account, role and person with a warning from 80 % and a block from 100 %."

[[items]]
  status = "done"
  milestone = "6"
  [items.title]
    de = "Vergleichsmodus"
    en = "Comparison mode"
  [items.text]
    de = "Dieselbe Frage an zwei oder drei Modelle gleichzeitig, Antworten nebeneinander. Sie bleiben als Versionen im Chat erhalten."
    en = "Ask two or three models the same question at once and see the answers side by side. They are kept as versions in the chat."

[[items]]
  status = "done"
  milestone = "13"
  [items.title]
    de = "Kontextmenü im Chat"
    en = "Context menu in the chat"
  [items.text]
    de = "Markierten Text per Rechtsklick oder Leiste als Zitat mit Herkunft ins Eingabefeld übernehmen, auch mehrere nacheinander. Dazu Nachfragen, Erklären, Vereinfachen, Übersetzen, Gegenargumente und Belege suchen. Gesendet wird nichts von selbst."
    en = "Right-click or use the bar to quote selected text with its origin in the input field, several quotes in a row if you like. Plus follow-up questions, explain, simplify, translate, counter-arguments and finding evidence. Nothing is sent on its own."

[[items]]
  status = "done"
  milestone = "4a"
  [items.title]
    de = "Werkzeuge über MCP"
    en = "Tools via MCP"
  [items.text]
    de = "Modelle rufen Werkzeuge aus MCP-Servern auf. Server lassen sich aus „mcpServers“-JSON importieren und zeigen ihren Online-Status. Welche Modelle MCP nutzen dürfen, legt der Verwalter je Modell fest; heikle Aufrufe brauchen eine Bestätigung. Bei vielen Werkzeugen sucht sich das Modell die passenden selbst, damit der Kontext lokaler Modelle reicht."
    en = "Models call tools from MCP servers. Servers can be imported from “mcpServers” JSON and show their online status. The administrator decides per model which ones may use MCP; sensitive calls need a confirmation. With many tools the model looks up the ones it needs, so the context of local models is enough."

[[items]]
  status = "done"
  milestone = "15"
  [items.title]
    de = "MultiGPT als MCP-Server"
    en = "MultiGPT as an MCP server"
  [items.text]
    de = "Andere Programme wie n8n, Claude oder eigene Agenten steuern MultiGPT mit dem API-Key eines Kontos: Modelle fragen, Dokumente hochladen und durchsuchen, Indexierung verfolgen und pausieren, Dateien abholen, eigene Chats lesen. Ein Key kann nie mehr als sein Konto."
    en = "Other programs such as n8n, Claude or your own agents control MultiGPT with an account's API key: ask models, upload and search documents, follow and pause indexing, fetch files, read your own chats. A key can never do more than its account."

[[items]]
  status = "done"
  milestone = "4a"
  [items.title]
    de = "Berechnungen in der Sandbox"
    en = "Calculations in a sandbox"
  [items.text]
    de = "Modelle rechnen exakt mit Python, numpy, scipy, sympy und mpmath und zeichnen Diagramme mit matplotlib. Der Code läuft abgeschottet in bubblewrap: ohne Netz, ohne Server-Dateien, ohne Geheimnisse."
    en = "Models calculate exactly with Python, numpy, scipy, sympy and mpmath and draw charts with matplotlib. The code runs isolated in bubblewrap: no network, no server files, no secrets."

[[items]]
  status = "done"
  milestone = "4a"
  [items.title]
    de = "Arbeitsblätter als PDF"
    en = "Worksheets as PDF"
  [items.text]
    de = "Druckfertige Blätter – Lineaturen 0 bis 4, Karo, Rechenblätter mit Lösungen, Uhrzeiten, Zahlenstrahl, Sachunterricht, dazu Briefe und Tabellen. Aufgaben und Lösungen rechnet der Server, nicht das Modell."
    en = "Print-ready sheets – handwriting rulings 0 to 4, squared paper, arithmetic sheets with answers, clock faces, number lines, science worksheets, plus letters and tables. The server computes tasks and answers, not the model."

[[items]]
  status = "done"
  milestone = "7"
  [items.title]
    de = "Fragen an eigene Dokumente"
    en = "Ask your own documents"
  [items.text]
    de = "Sammlungen mit PDFs, Word-, Text- und Bilddateien, auch gescannte Seiten per OCR. Suche mit PostgreSQL und pgvector. Embeddings und OCR laufen auf Wunsch komplett lokal über LM Studio, Ordner vom NAS werden periodisch eingelesen. Mehrere Dokumente gleichzeitig, Läufe lassen sich pausieren."
    en = "Collections of PDFs, Word, text and image files, scanned pages included via OCR. Search with PostgreSQL and pgvector. Embeddings and OCR can run fully locally via LM Studio, and folders from the NAS are read in periodically. Several documents at once, and runs can be paused."

[[items]]
  status = "done"
  milestone = "7"
  [items.title]
    de = "Zitieren mit Fundstelle"
    en = "Citations with locators"
  [items.text]
    de = "Quellen mit Abschnitt, Seite und Absatz, im eigenen Zitierstil: DIN ISO 690, APA 7, Harvard, Chicago, MLA 9 oder BibTeX. Literaturangaben pflegbar, auch für Normen mit Nummer und Ausgabe."
    en = "Sources with section, page and paragraph, in your own citation style: DIN ISO 690, APA 7, Harvard, Chicago, MLA 9 or BibTeX. Bibliographic data can be edited, including standards with number and edition."

[[items]]
  status = "done"
  milestone = "7"
  [items.title]
    de = "Abbildungen und Dokument-Werkzeuge"
    en = "Figures and document tools"
  [items.text]
    de = "Ein Vision-Modell beschreibt Bilder und Diagramme in Dokumenten, damit die Suche sie findet. Modelle mit Werkzeugen listen Dokumente, lesen das Inhaltsverzeichnis und ganze Abschnitte – nur in Sammlungen, die man selbst lesen darf."
    en = "A vision model describes images and charts in documents so that search can find them. Models with tools list documents, read the table of contents and whole sections – only in collections you may read yourself."

[[items]]
  status = "done"
  milestone = "8"
  [items.title]
    de = "Websuche mit Quellen"
    en = "Web search with sources"
  [items.text]
    de = "Aktuelle Informationen aus dem Netz über ein selbst gehostetes SearXNG, mit Links unter der Antwort – auch für lokale Modelle."
    en = "Current information from the web via a self-hosted SearXNG, with links below the answer – for local models too."

[[items]]
  status = "done"
  milestone = "8"
  [items.title]
    de = "Seiten abrufen, erfundene Links markieren"
    en = "Fetch pages, flag invented links"
  [items.text]
    de = "Modelle lesen Webseiten und kleine Websites (mit SSRF-Schutz und robots.txt), auch URLs aus der Frage. Links ohne Quelle in der Antwort bekommen ein ⚠ und einen Knopf „Belege prüfen“."
    en = "Models read web pages and small sites (with SSRF protection and robots.txt), including URLs from your question. Links in an answer without a source get a ⚠ and a “check sources” button."

[[items]]
  status = "partial"
  milestone = "9"
  [items.title]
    de = "Bilder erzeugen und bearbeiten"
    en = "Create and edit images"
  [items.text]
    de = "Bilder erzeugen mit OpenAI gpt-image oder Gemini: als Werkzeug des Chatmodells oder im Modus „Bild“. Bereiche ändern, Varianten und klassische Bearbeitung folgen."
    en = "Generate images with OpenAI gpt-image or Gemini: as a tool of the chat model or in “image” mode. Editing areas, variations and classic editing follow."

[[items]]
  status = "planned"
  milestone = "10"
  [items.title]
    de = "Sprechen und Vorlesen"
    en = "Speak and listen"
  [items.text]
    de = "Frage einsprechen, Text vor dem Senden korrigieren, Antworten vorlesen lassen."
    en = "Speak your question, correct the text before sending, have answers read aloud."

[[items]]
  status = "planned"
  milestone = "13"
  [items.title]
    de = "Scratchpad"
    en = "Scratchpad"
  [items.text]
    de = "Material aus Chats, Dokumenten und dem Web mit Herkunft sammeln und daraus ein belegtes Gesamtdokument erzeugen, mit geprüften Zitaten und Literaturverzeichnis."
    en = "Collect material from chats, documents and the web with its origin, and turn it into a fully referenced document with verified quotes and a bibliography."

[[items]]
  status = "done"
  milestone = "14"
  [items.title]
    de = "Runner"
    en = "Runner"
  [items.text]
    de = "Neu in 0.4.0: ein Container auf dem eigenen Rechner (Podman rootless), in dem ein Modell wie ein Coding-Werkzeug arbeitet – eingesperrt und standardmäßig ohne Netz. Terminal, HTML-Vorschau und Webserver, Arbeitsstand als git-Bundle auf dem Server, Zeitkontingent je Rolle. Die Web-Ports sind standardmäßig im Heimnetz ohne Anmeldung erreichbar. Docker wird nicht unterstützt."
    en = "New in 0.4.0: a container on your own computer (rootless Podman) in which a model works like a coding tool – locked in and without network by default. Terminal, HTML preview and web server, work stored as a git bundle on the server, a time quota per role. The web ports are by default reachable on the home network without any login. Docker is not supported."
