  [milestones.title]
    de = "Scratchpad"
    en = "Scratchpad"
  [milestones.text]
    de = "Material aus Chats, eigenen Dokumenten, dem Web, Werkzeugen, Bildern und Notizen sammeln, jeweils mit Herkunft und Zitierangabe, und daraus ein belegtes Gesamtdokument erzeugen. Das Modell schreibt nur aus den gesammelten Einträgen. Kurzbelege und Literaturverzeichnis setzt MultiGPT im gewählten Zitierstil, wörtliche Zitate werden gegen die Quelle geprüft. Export als Markdown, DOCX und PDF. Dazu ein Kontextmenü im Chat mit „Ins Scratchpad“, Nachfragen, Schnellaktionen und eigenen Prompt-Vorlagen."
    en = "Collect material from chats, your own documents, the web, tools, images and notes, each with its origin and citation data, and turn it into a fully referenced document. The model writes only from the collected entries. MultiGPT sets the in-text citations and the bibliography in the chosen citation style and checks verbatim quotes against the source. Export as Markdown, DOCX and PDF. Plus a context menu in the chat with “add to scratchpad”, follow-up questions, quick actions and your own prompt templates."
