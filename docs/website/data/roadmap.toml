# Meilensteine aus doc/Plan.md, Abschnitt 11.
# status: "done" | "partial" | "planned"  (Texte dazu in i18n/*.toml)
# Beim Abschluss eines Meilensteins hier den Status ändern – Startseite und
# Roadmap lesen beide aus dieser Datei. Stand: Version 0.3.1.

[[milestones]]
  id = "1"
  status = "done"
  [milestones.title]
    de = "Grundgerüst"
    en = "Project skeleton"
  [milestones.text]
    de = "Django-Projekt mit Einstellungen aus der Umgebung, Makefile, Anmeldung mit Login-Drosselung, gunicorn (gthread), Health-Check `/healthz/`, Debian-Paket mit systemd-Unit und `mgpt-ctl`, Docker-Dateien. Das Paket legt bei lokalem PostgreSQL Rolle, Datenbank und pgvector an, migriert automatisch, fragt Hostnamen und Zertifikat per debconf ab und richtet nginx mit TLS ein."
    en = "Django project configured from the environment, Makefile, login with brute-force throttling, gunicorn (gthread), health check `/healthz/`, Debian package with systemd unit and `mgpt-ctl`, Docker files. With a local PostgreSQL the package creates the role, database and pgvector, migrates automatically, asks for host names and certificate via debconf and sets up nginx with TLS."
  [milestones.note]
    de = "Tests, Linter und `make deb` sind grün, Versionen werden mit `make release` getaggt (aktuell 0.3.1). Noch offen für die Abnahme: Testinstallation auf einem frischen Debian 13 und der Docker-Build (ungetestet)."
    en = "Tests, linter and `make deb` pass, and versions are tagged with `make release` (currently 0.3.1). Still open for acceptance: a test installation on a fresh Debian 13 and the Docker build (untested)."

[[milestones]]
  id = "2"
  status = "done"
  [milestones.title]
    de = "Datenmodell und Verwaltung"
    en = "Data model and admin"
  [milestones.text]
    de = "Anbieter, Modelle, Rollen und Gruppen; Konten erweitern Djangos User und Group. Verschlüsselte API-Keys (Fernet, die Verwaltung zeigt nur die letzten 4 Zeichen), zentrale Rechteprüfung, Verwaltung nur für Verwalter. Private Chats erscheinen auch dort nur als Metadaten. Vier Startrollen: Verwalter, Erwachsener, Jugendlicher, Gast."
    en = "Providers, models, roles and groups; accounts extend Django's User and Group. Encrypted API keys (Fernet, the admin area shows only the last 4 characters), a central permission check, admin area for administrators only. Private chats appear there only as metadata. Four default roles: administrator, adult, teenager, guest."
  [milestones.note]
    de = "Abgeschlossen. Jugendliche und Gäste haben anfangs keine Modelle; der Verwalter gibt sie pro Rolle frei."
    en = "Complete. Teenagers and guests start without models; the administrator enables them per role."

[[milestones]]
  id = "3"
  status = "done"
  [milestones.title]
    de = "Erster Anbieter und Streaming"
    en = "First provider and streaming"
  [milestones.text]
    de = "OpenAI-kompatibler Adapter (OpenAI, OpenRouter, LM Studio), gestreamte Antworten mit Abbrechen-Knopf, Neu erzeugen, Modell pro Nachricht, Chatansicht mit gespeichertem Verlauf."
    en = "OpenAI-compatible adapter (OpenAI, OpenRouter, LM Studio), streamed answers with a stop button, regenerate, model per message, chat view with saved history."
  [milestones.note]
    de = "Ende-zu-Ende im Browser getestet; gestreamte Antworten mit echtem OpenAI-Key laufen."
    en = "Tested end to end in the browser; streamed answers with a real OpenAI key work."

[[milestones]]
  id = "4"
  status = "done"
  [milestones.title]
    de = "Weitere Anbieter und LM Studio"
    en = "More providers and LM Studio"
  [milestones.text]
    de = "Adapter für Anthropic und Google Gemini, Modelllisten abrufen mit `make sync-models`, LM Studio als lokaler Anbieter mit Online-Anzeige und automatisch angebotenen Modellen."
    en = "Adapters for Anthropic and Google Gemini, fetching model lists with `make sync-models`, LM Studio as a local provider with online indicator and automatically offered models."
  [milestones.note]
    de = "LM Studio läuft im echten Heimnetz. Seit 0.3.0 bekommen neue Modelle ihre Fähigkeiten automatisch (bei LM Studio aus dessen Modellliste), dazu die Fähigkeiten-Matrix im Admin, ausgegraute Offline-Anbieter und eine eigene Meldung für abgelaufene API-Keys. Noch offen für die Abnahme: echte Aufrufe an Anthropic und Gemini."
    en = "LM Studio runs in a real home network. Since 0.3.0 new models get their capabilities automatically (for LM Studio from its model list), plus the capability matrix in the admin, greyed-out offline providers and a dedicated message for expired API keys. Still open for acceptance: real calls to Anthropic and Gemini."

[[milestones]]
  id = "4a"
  status = "done"
  [milestones.title]
    de = "MCP-Werkzeuge"
    en = "MCP tools"
  [milestones.text]
    de = "Modelle nutzen Werkzeuge aus angebundenen MCP-Servern – mit Rechteprüfung, Rückfrage vor heiklen Aufrufen und Anzeige im Chat. Dazu eingebaute Werkzeuge für Berechnungen und PDF-Blätter."
    en = "Models use tools from connected MCP servers – with permission checks, confirmation before sensitive calls and display in the chat. Plus built-in tools for calculations and PDF sheets."
  [milestones.note]
    de = "Werkzeugschleife mit höchstens 10 Runden, Rückfrage vor nicht freigegebenen Werkzeugen (auch nach Neuladen), Anzeige jedes Aufrufs im Chat. Seit 0.3.0: Import aus „mcpServers“-JSON, Online-Status je Server, Werkzeugtabelle mit Einstufung im Admin, MCP-Freigabe je Modell (kein, alle, ausgewählte; serverseitig geprüft) und das Werkzeug `run_python` in einer bubblewrap-Sandbox. Seit 0.3.1 das Werkzeug `create_pdf` für Arbeitsblätter, Briefe und Tabellen. MCP-Werkzeuge laufen auch mit lokalen Modellen über LM Studio."
    en = "Tool loop with at most 10 rounds, confirmation before unapproved tools (also after a reload), every call shown in the chat. Since 0.3.0: import from “mcpServers” JSON, online status per server, a tool table with classification in the admin, MCP access per model (none, all, selected; checked on the server) and the `run_python` tool in a bubblewrap sandbox. Since 0.3.1 the `create_pdf` tool for worksheets, letters and tables. MCP tools also work with local models via LM Studio."

[[milestones]]
  id = "5"
  status = "done"
  [milestones.title]
    de = "Komfort"
    en = "Convenience"
  [milestones.text]
    de = "Markdown mit Code-Hervorhebung und Kopierknopf (Bibliotheken lokal eingebunden, Ausgabe bereinigt), Formeln mit KaTeX, SVG-Vorschau, automatische Chattitel, Umbenennen, Archiv, Löschen, Suche, Export als Markdown, System-Prompt pro Chat. Dazu Anhänge, Projekte und geteilte Chats."
    en = "Markdown with code highlighting and a copy button (libraries bundled locally, output sanitised), formulas with KaTeX, SVG preview, automatic chat titles, rename, archive, delete, search, Markdown export, system prompt per chat. Plus attachments, projects and shared chats."
  [milestones.note]
    de = "Abgeschlossen. Nachgezogen: eigene Nachrichten bearbeiten mit Versionen („‹ 1/2 ›“) und Kopierknopf. In 0.3.0 kamen Anhänge mit Bild-Eingabe (EXIF entfernt), Projekte mit Anweisungen, Standardmodell und Sammlungen, Chats teilen mit RWUD-Rechten sowie eine überarbeitete Oberfläche (Antworten in voller Breite, Seitenleiste ausblendbar, Schriftgröße A−/A+) dazu."
    en = "Complete. Follow-ups: editing your own messages with versions (“‹ 1/2 ›”) and a copy button. Version 0.3.0 added attachments with image input (EXIF removed), projects with instructions, default model and collections, chat sharing with RWUD permissions and a reworked interface (full-width answers, collapsible sidebar, font size A−/A+)."

[[milestones]]
  id = "6"
  status = "done"
  [milestones.title]
    de = "Vergleich, Verbrauch, Budgets, Familie"
    en = "Comparison, usage, budgets, family"
  [milestones.text]
    de = "Dieselbe Frage an mehrere Modelle, Verbrauchsübersicht, Monatsbudgets und die Verwaltungsseite „Familie“."
    en = "The same question to several models, usage overview, monthly budgets and the “Family” admin page."
  [milestones.note]
    de = "Umgesetzt: Vergleichsmodus mit zwei oder drei Modellen, die Antworten als Versionen im Chat-Baum (Werkzeuge sind im Vergleich aus); Verbrauch und Monatsbudgets mit Hinweis ab 80 % und Sperre ab 100 % außer für kostenfreie Modelle; Seite „Mein Verbrauch“; Seite „Familie“ mit Konten, Rollen, Budgets und Gruppen sowie lesender Einsicht in Chats von Jugendlichen nur mit Option und dauerhaftem Hinweis. Seit 0.3.0 rechnet ein Kontenrahmen ab: Konten in Geld, nur Tokens oder als Pauschale, Preise mit Gültigkeit samt Cache und Reasoning, Wechselkurse, Buchungen und Budgets je Konto."
    en = "Implemented: comparison mode with two or three models, the answers stored as versions in the chat tree (tools are off in comparison); usage and monthly budgets with a warning from 80 % and a block from 100 % except for free models; a personal usage page; a “Family” page with accounts, roles, budgets and groups, plus read-only insight into teenagers' chats only with an option and a permanent notice. Since 0.3.0 billing runs through accounts: monetary, tokens only or flat rate, prices with validity dates including cache and reasoning, exchange rates, bookings and budgets per account."

[[milestones]]
  id = "7"
  status = "done"
  [milestones.title]
    de = "Eigene Dokumente (RAG)"
    en = "Your own documents (RAG)"
  [milestones.text]
    de = "Sammlungen, Upload, Indexierung im Hintergrund, Suche mit pgvector, Quellen mit Seitenangabe."
    en = "Collections, upload, background indexing, search with pgvector, sources with page numbers."
  [milestones.note]
    de = "Umgesetzt: Sammlungen mit Freigaben, Upload (PDF, DOCX, TXT, MD), Worker mit Wiederholung und OCR (Tesseract), Suche mit Zugriffsfilter in SQL und Volltext, Quellen mit Seitenzahl, Werkzeug für die Dokumentsuche und eine eigene RAG-Verwaltung im Admin. Embeddings lokal über LM Studio (nomic-embed-text, 768 Dimensionen), OCR mit olmOCR über LM Studio und Tesseract als Ersatz, beides im Admin per Knopf testbar; Verzeichnisquellen vom Server oder NAS, beschränkt auf `RAG_SOURCE_ROOTS` und periodisch eingelesen. Seit 0.3.0: Zitieren mit Abschnitt, Seite und Absatz in sechs Stilen samt Literaturangaben und Normen, Abbildungen per Vision-Modell beschrieben, Bilddateien als Dokument, die Dokument-Werkzeuge `list_documents`, `document_info` und `read_document`, Dokumente im Browser ansehen und Aufträge abbrechen."
    en = "Implemented: collections with sharing, upload (PDF, DOCX, TXT, MD), a worker with retries and OCR (Tesseract), search with access filtering in SQL plus full text, sources with page numbers, a document search tool and a dedicated RAG section in the admin. Embeddings locally via LM Studio (nomic-embed-text, 768 dimensions), OCR with olmOCR via LM Studio and Tesseract as a fallback, both testable with a button in the admin; directory sources from the server or NAS, limited to `RAG_SOURCE_ROOTS` and read in periodically. Since 0.3.0: citations with section, page and paragraph in six styles including bibliographic data and standards, figures described by a vision model, image files as documents, the document tools `list_documents`, `document_info` and `read_document`, viewing documents in the browser and cancelling jobs."

[[milestones]]
  id = "8"
  status = "done"
  [milestones.title]
    de = "Websuche"
    en = "Web search"
  [milestones.text]
    de = "Austauschbares Such-Backend, geschützter Seitenabruf, Quellen unter der Antwort."
    en = "Swappable search backend, protected page fetching, sources below the answer."
  [milestones.note]
    de = "Umgesetzt mit einem selbst gehosteten SearXNG: Schalter „Websuche“ im Chat und Werkzeug für Modelle, „SearXNG testen“ im Admin, Seitenabruf ohne Zugriff auf Adressen im Heimnetz, Webtext nur als markiertes Quellmaterial. Seit 0.3.0 die Werkzeuge `fetch_url` und `crawl_site` (SSRF-geschützt, beachten robots.txt), URLs aus der Frage, Markierung erfundener Links und Grundregeln für alle Modelle. Eine Such-API ist nicht angebunden."
    en = "Implemented with a self-hosted SearXNG: a “web search” switch in the chat and a tool for models, “SearXNG testen” in the admin, page fetching without access to home-network addresses, web text only as marked source material. Since 0.3.0 the `fetch_url` and `crawl_site` tools (SSRF-protected, respecting robots.txt), URLs from the question, flagging of invented links and base rules for all models. No search API is connected."

[[milestones]]
  id = "9"
  status = "partial"
  [milestones.title]
    de = "Bilder"
    en = "Images"
  [milestones.text]
    de = "Bilderzeugung, Bereich ändern (Inpainting), Varianten und klassische Bearbeitung über einen mitgelieferten MCP-Server."
    en = "Image generation, editing a marked area (inpainting), variations and classic editing via a bundled MCP server."
  [milestones.note]
    de = "M9-01 umgesetzt (0.3.0): Bilderzeugung mit OpenAI gpt-image und Gemini, als Werkzeug `generate_image` des Chatmodells, im Modus „Bild“ und per Hinweis „Mit Bildmodell erzeugen“ bei Modellen ohne Werkzeuge; Bilder ohne Metadaten, Kosten je Bild. Offen: Bereich ändern, Varianten und der MCP-Server für klassische Bearbeitung."
    en = "M9-01 done (0.3.0): image generation with OpenAI gpt-image and Gemini, as the chat model's `generate_image` tool, in “image” mode and via a “generate with image model” hint for models without tools; images without metadata, cost per image. Still open: editing areas, variations and the MCP server for classic editing."

