[[milestones]]
  id = "1"
  status = "done"
  [milestones.title]
    de = "Grundgerüst"
    en = "Project skeleton"
  [milestones.text]
    de = "Django-Projekt mit Einstellungen aus der Umgebung, Makefile, Anmeldung mit Login-Drosselung, leere Chatseite, gunicorn (gthread), Health-Check `/healthz/`, Debian-Paket mit systemd-Unit und `mgpt-ctl`, Docker-Dateien."
    en = "Django project configured from the environment, Makefile, login with brute-force throttling, empty chat page, gunicorn (gthread), health check `/healthz/`, Debian package with systemd unit and `mgpt-ctl`, Docker files."
  [milestones.note]
    de = "Tests, Linter und gunicorn-Start sind grün. Noch offen für die Abnahme: echter Paketbau mit `make deb`, Installation auf einem frischen Debian 13 und der Docker-Build."
    en = "Tests, linter and gunicorn start pass. Still open for acceptance: a real package build with `make deb`, installation on a fresh Debian 13 and the Docker build."

