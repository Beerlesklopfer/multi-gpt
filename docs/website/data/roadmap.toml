# Meilensteine aus doc/Plan.md, Abschnitt 11.
# status: "done" | "partial" | "progress" | "planned"  (Texte dazu in i18n/*.toml;
#   "progress" = in Arbeit, noch nicht veröffentlicht; derzeit nirgends in Gebrauch)
# Beim Abschluss eines Meilensteins hier den Status ändern – Startseite und
# Roadmap lesen beide aus dieser Datei. Stand: Version 0.4.0 (veröffentlicht).
# steps: Arbeitspakete je Meilenstein (id, status, optional version = erschienen mit;
