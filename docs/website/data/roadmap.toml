[[milestones]]
  id = "14"
  status = "done"
  [milestones.title]
    de = "Runner"
    en = "Runner"
  [milestones.text]
    de = "Ein Container auf dem Rechner, an dem der Browser läuft (Podman rootless; unter Windows und macOS über WSL2 bzw. eine Linux-VM), als Arbeitsumgebung für Modelle: Sie lesen, suchen und ändern Dateien, führen Befehle aus, testen und bessern nach – wie ein Programmierwerkzeug, aber eingesperrt. Der Container hat standardmäßig kein Netz (nur mit dem Rollenrecht „Paketquellen“ über einen Proxy zu festen Paketquellen) und nur einen flüchtigen Arbeitsbereich im Arbeitsspeicher; der Arbeitsstand liegt als git-Bundle mit der ganzen Historie auf dem Server und wird mit der Datenbank gesichert. Gekoppelt wird per Token (nur gehasht gespeichert, widerrufbar, mit Ablauf), die Verbindung geht nur ausgehend per WebSocket über TLS. Jeder Zugriff läuft über MultiGPT: Rechte, Rückfrage-Modi, Kontingent und Audit-Log prüft der Server. Im Chat gibt es ein Terminal im Browser, eine Vorschau für HTML-Seiten im abgeschotteten Rahmen und die Aufgabenliste des Modells. Geräte im Heimnetz lassen sich per `ssh` oder `telnet` steuern – nur solche, die der Verwalter freigibt, und mit Rückfrage vor jedem Befehl. Abgerechnet wird über die Kontoart „Laufzeit“ in Container-Minuten je Rolle bzw. Person und Monat, mit Hinweis ab 80 % und Stopp bei 100 % – der Arbeitsstand bleibt erhalten."
    en = "A container on the computer the browser runs on (rootless Podman; on Windows and macOS via WSL2 or a Linux VM) as a workspace for models: they read, search and edit files, run commands, test and fix – like a coding tool, but locked in. By default the container has no network (with the “package sources” permission only through a proxy to fixed package sources) and only a volatile in-memory workspace; the work is stored on the server as a git bundle with its full history and is backed up with the database. Pairing uses a token (stored only as a hash, revocable, with an expiry date), and the runner connects outgoing only, via WebSocket over TLS. Every access goes through MultiGPT: the server checks permissions, confirmation modes, quota and the audit log. In the chat there is a terminal in the browser, a preview for HTML pages in a sandboxed frame and the model's task list. Devices on the home network can be controlled via `ssh` or `telnet` – only those the administrator approves, and with a confirmation before every command. Usage is billed through the “runtime” account type in container minutes per role or person and month, with a warning from 80 % and a stop at 100 % – the work is kept."
  [milestones.note]
    de = "Erschienen mit Version 0.4.0. Gegenüber dem ersten Plan geändert: Arbeitsstand als git-Bundle auf dem Server statt Volumes auf dem Rechner, das Modell arbeitet in vielen Runden wie ein Coding-Werkzeug statt nur einzelne Befehle auszuführen, dazu `ssh` und `telnet` zu freigegebenen Geräten, Paketquellen über einen Proxy mit Positivliste, ein Webserver (lighttpd) und der Agent als Rust-Programm `multigpt-runner`. Die Web-Ports des Runners sind standardmäßig im ganzen Heimnetz ohne Anmeldung erreichbar. Noch offen: Docker wird nicht unterstützt (nur Podman), es fehlen inkrementelle Bundles, Container-Logs auf der Seite „Runner“ und die Live-Ausgabe der Werkzeugläufe im Chat-Terminal."
    en = "Released with version 0.4.0. Changed from the first plan: the work is stored as a git bundle on the server instead of volumes on the client, the model works in many rounds like a coding tool instead of running single commands only, plus `ssh` and `telnet` to approved devices, package sources through a proxy with an allow list, a web server (lighttpd) and the agent as a Rust program `multigpt-runner`. The runner's web ports are by default reachable by the whole home network without any login. Still open: Docker is not supported (Podman only), and incremental bundles, container logs on the “Runner” page and live output of tool runs in the chat terminal are missing."

