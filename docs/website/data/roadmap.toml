[[milestones]]
  id = "15"
  status = "done"
  [milestones.title]
    de = "Knoten"
    en = "Node"
  [milestones.text]
    de = "MultiGPT als MCP-Server: Jedes Konto kann API-Keys anlegen, deren Rechte nie über die eigene Rolle hinausgehen. Andere Programme wie n8n, Claude oder Cursor fragen damit Modelle, durchsuchen und laden Dokumente, starten und verfolgen die Indexierung und holen erzeugte Dateien ab. Keys werden nur gehasht gespeichert, sind widerrufbar und haben auf Wunsch ein Ablaufdatum; jeder Aufruf landet ohne Inhalte im Audit-Log. Dazu Befehle für die Kommandozeile und Chat-Werkzeuge für die Indexierung."
    en = "MultiGPT as an MCP server: every account can create API keys whose permissions never exceed its own role. Other programs such as n8n, Claude or Cursor use them to ask models, search and upload documents, start and follow indexing and fetch generated files. Keys are stored only as a hash, can be revoked and optionally expire; every call is recorded in the audit log without content. Plus command-line commands and chat tools for indexing."
  [milestones.note]
    de = "Umgesetzt mit Version 0.3.2. Seit 0.3.3 liefern die Werkzeuge ihre Ergebnisse direkt (Text, Bilder, PDF); seit 0.3.6 lesen Keys mit dem Recht „Chats lesen“ eigene und mit dem Konto geteilte Chats, Indexierungsläufe lassen sich pausieren, und Chats aus `ask` landen im Projekt „API“. Offen für die Abnahme: n8n-Workflows gegen ein installiertes Paket und der ältere Transport mit verschiedenen Clients im Betrieb."
    en = "Done with version 0.3.2. Since 0.3.3 the tools return their results directly (text, images, PDF); since 0.3.6 keys with the “read chats” permission can read the account's own chats and chats shared with it, indexing runs can be paused, and chats created by `ask` go into an “API” project. Still open for acceptance: n8n workflows against an installed package and the older transport with various clients in practice."

