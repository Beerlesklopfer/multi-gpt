  status = "done"
  [milestones.title]
    de = "Websuche"
    en = "Web search"
  [milestones.text]
    de = "Austauschbares Such-Backend, geschützter Seitenabruf, Quellen unter der Antwort."
    en = "Swappable search backend, protected page fetching, sources below the answer."
