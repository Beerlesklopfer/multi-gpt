# Meilensteine aus doc/Plan.md, Abschnitt 11.
# status: "done" | "partial" | "planned"  (Texte dazu in i18n/*.toml)
# Beim Abschluss eines Meilensteins hier den Status ändern – Startseite und
# Roadmap lesen beide aus dieser Datei.

[[milestones]]
  id = "1"
  status = "done"
  [milestones.title]
    de = "Grundgerüst"
    en = "Project skeleton"
  [milestones.text]
    de = "Django-Projekt mit Einstellungen aus der Umgebung, Makefile, Anmeldung mit Login-Drosselung, gunicorn (gthread), Health-Check `/healthz/`, Debian-Paket mit systemd-Unit und `mgpt-ctl`, Docker-Dateien. Das Paket legt bei lokalem PostgreSQL Rolle, Datenbank und pgvector an, migriert automatisch, fragt Hostnamen und Zertifikat per debconf ab und richtet nginx mit TLS ein."
    en = "Django project configured from the environment, Makefile, login with brute-force throttling, gunicorn (gthread), health check `/healthz/`, Debian package with systemd unit and `mgpt-ctl`, Docker files. With a local PostgreSQL the package creates the role, database and pgvector, migrates automatically, asks for host names and certificate via debconf and sets up nginx with TLS."
  [milestones.note]
    de = "Tests, Linter und `make deb` sind grün. Noch offen für die Abnahme: Testinstallation auf einem frischen Debian 13 und der Docker-Build (ungetestet)."
    en = "Tests, linter and `make deb` pass. Still open for acceptance: a test installation on a fresh Debian 13 and the Docker build (untested)."

[[milestones]]
  id = "2"
  status = "done"
  [milestones.title]
    de = "Datenmodell und Verwaltung"
    en = "Data model and admin"
  [milestones.text]
    de = "Anbieter, Modelle, Rollen und Gruppen; Konten erweitern Djangos User und Group. Verschlüsselte API-Keys (Fernet, die Verwaltung zeigt nur die letzten 4 Zeichen), zentrale Rechteprüfung, Verwaltung nur für Verwalter. Private Chats erscheinen auch dort nur als Metadaten. Vier Startrollen: Verwalter, Erwachsener, Jugendlicher, Gast."
    en = "Providers, models, roles and groups; accounts extend Django's User and Group. Encrypted API keys (Fernet, the admin area shows only the last 4 characters), a central permission check, admin area for administrators only. Private chats appear there only as metadata. Four default roles: administrator, adult, teenager, guest."
  [milestones.note]
    de = "Abgeschlossen. Jugendliche und Gäste haben anfangs keine Modelle; der Verwalter gibt sie pro Rolle frei."
    en = "Complete. Teenagers and guests start without models; the administrator enables them per role."

[[milestones]]
  id = "3"
  status = "done"
  [milestones.title]
    de = "Erster Anbieter und Streaming"
    en = "First provider and streaming"
  [milestones.text]
    de = "OpenAI-kompatibler Adapter (OpenAI, OpenRouter, LM Studio), gestreamte Antworten mit Abbrechen-Knopf, Neu erzeugen, Modell pro Nachricht, Chatansicht mit gespeichertem Verlauf."
    en = "OpenAI-compatible adapter (OpenAI, OpenRouter, LM Studio), streamed answers with a stop button, regenerate, model per message, chat view with saved history."
  [milestones.note]
    de = "Ende-zu-Ende im Browser getestet; gestreamte Antworten mit echtem OpenAI-Key laufen."
    en = "Tested end to end in the browser; streamed answers with a real OpenAI key work."

[[milestones]]
  id = "4"
  status = "done"
  [milestones.title]
    de = "Weitere Anbieter und LM Studio"
    en = "More providers and LM Studio"
  [milestones.text]
    de = "Adapter für Anthropic und Google Gemini, Modelllisten abrufen mit `make sync-models`, LM Studio als lokaler Anbieter mit Online-Anzeige und automatisch angebotenen Modellen."
    en = "Adapters for Anthropic and Google Gemini, fetching model lists with `make sync-models`, LM Studio as a local provider with online indicator and automatically offered models."
  [milestones.note]
    de = "LM Studio läuft im echten Heimnetz. Noch offen für die Abnahme: echte Aufrufe an Anthropic und Gemini."
    en = "LM Studio runs in a real home network. Still open for acceptance: real calls to Anthropic and Gemini."

[[milestones]]
  id = "4a"
  status = "done"
  [milestones.title]
    de = "MCP-Werkzeuge"
    en = "MCP tools"
  [milestones.text]
    de = "Modelle nutzen Werkzeuge aus angebundenen MCP-Servern – mit Rechteprüfung, Rückfrage vor heiklen Aufrufen und Anzeige im Chat."
    en = "Models use tools from connected MCP servers – with permission checks, confirmation before sensitive calls and display in the chat."
  [milestones.note]
    de = "Werkzeugschleife mit höchstens 10 Runden, Rückfrage vor nicht freigegebenen Werkzeugen (auch nach Neuladen), Anzeige jedes Aufrufs im Chat, Schalter je MCP-Server. Mit einem MCP-Testserver und simulierten Anbietern getestet, Ende-zu-Ende im Browser. Noch offen: Test mit echten Modellen."
    en = "Tool loop with at most 10 rounds, confirmation before unapproved tools (also after a reload), every call shown in the chat, a switch per MCP server. Tested with an MCP test server and simulated providers, end-to-end in the browser. Still open: a test with real models."

[[milestones]]
  id = "5"
  status = "done"
  [milestones.title]
    de = "Komfort"
    en = "Convenience"
  [milestones.text]
    de = "Markdown mit Code-Hervorhebung und Kopierknopf (Bibliotheken lokal eingebunden, Ausgabe bereinigt), automatische Chattitel, Umbenennen, Archiv, Löschen, Suche, Export als Markdown, System-Prompt pro Chat."
    en = "Markdown with code highlighting and a copy button (libraries bundled locally, output sanitised), automatic chat titles, rename, archive, delete, search, Markdown export, system prompt per chat."
  [milestones.note]
    de = "Abgeschlossen, nachgezogen: eigene Nachrichten bearbeiten mit Versionen („‹ 1/2 ›“) wie in ChatGPT und Kopierknopf."
    en = "Complete, with a follow-up: editing your own messages with versions (“‹ 1/2 ›”) as in ChatGPT and a copy button."

[[milestones]]
  id = "6"
  status = "done"
  [milestones.title]
    de = "Vergleich, Verbrauch, Budgets, Familie"
    en = "Comparison, usage, budgets, family"
  [milestones.text]
    de = "Dieselbe Frage an mehrere Modelle, Verbrauchsübersicht, Monatsbudgets und die Verwaltungsseite „Familie“."
    en = "The same question to several models, usage overview, monthly budgets and the “Family” admin page."
  [milestones.note]
    de = "Umgesetzt: Vergleichsmodus mit zwei oder drei Modellen, die Antworten als Versionen im Chat-Baum (Werkzeuge sind im Vergleich aus); Verbrauch und Monatsbudgets mit Hinweis ab 80 % und Sperre ab 100 % außer für kostenfreie Modelle; Seite „Mein Verbrauch“; Seite „Familie“ mit Konten, Rollen, Budgets und Gruppen sowie lesender Einsicht in Chats von Jugendlichen nur mit Option und dauerhaftem Hinweis."
    en = "Implemented: comparison mode with two or three models, the answers stored as versions in the chat tree (tools are off in comparison); usage and monthly budgets with a warning from 80 % and a block from 100 % except for free models; a personal usage page; a “Family” page with accounts, roles, budgets and groups, plus read-only insight into teenagers' chats only with an option and a permanent notice."

[[milestones]]
  id = "7"
  status = "done"
  [milestones.title]
    de = "Eigene Dokumente (RAG)"
    en = "Your own documents (RAG)"
  [milestones.text]
    de = "Sammlungen, Upload, Indexierung im Hintergrund, Suche mit pgvector, Quellen mit Seitenangabe."
    en = "Collections, upload, background indexing, search with pgvector, sources with page numbers."
  [milestones.note]
    de = "Umgesetzt: Sammlungen mit Freigaben, Upload (PDF, DOCX, TXT, MD), Worker mit Wiederholung und OCR (Tesseract), Suche mit Zugriffsfilter in SQL und Volltext, Quellen mit Seitenzahl, Werkzeug für die Dokumentsuche und eine eigene RAG-Verwaltung im Admin. Embeddings lokal über LM Studio (nomic-embed-text, 768 Dimensionen), OCR mit olmOCR über LM Studio und Tesseract als Ersatz, beides im Admin per Knopf testbar; Verzeichnisquellen vom Server oder NAS, beschränkt auf `RAG_SOURCE_ROOTS` und periodisch eingelesen."
    en = "Implemented: collections with sharing, upload (PDF, DOCX, TXT, MD), a worker with retries and OCR (Tesseract), search with access filtering in SQL plus full text, sources with page numbers, a document search tool and a dedicated RAG section in the admin. Embeddings locally via LM Studio (nomic-embed-text, 768 dimensions), OCR with olmOCR via LM Studio and Tesseract as a fallback, both testable with a button in the admin; directory sources from the server or NAS, limited to `RAG_SOURCE_ROOTS` and read in periodically."

[[milestones]]
  id = "8"
  status = "done"
  [milestones.title]
    de = "Websuche"
    en = "Web search"
  [milestones.text]
    de = "Austauschbares Such-Backend, geschützter Seitenabruf, Quellen unter der Antwort."
    en = "Swappable search backend, protected page fetching, sources below the answer."
  [milestones.note]
    de = "Umgesetzt mit einem selbst gehosteten SearXNG: Schalter „Websuche“ im Chat und Werkzeug für Modelle, „SearXNG testen“ im Admin, Seitenabruf ohne Zugriff auf Adressen im Heimnetz, Webtext nur als markiertes Quellmaterial. Eine Such-API ist nicht angebunden."
    en = "Implemented with a self-hosted SearXNG: a “web search” switch in the chat and a tool for models, “SearXNG testen” in the admin, page fetching without access to home-network addresses, web text only as marked source material. No search API is connected."

[[milestones]]
