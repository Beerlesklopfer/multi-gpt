[[milestones]]
  id = "4a"
  status = "done"
  [milestones.title]
    de = "MCP-Werkzeuge"
    en = "MCP tools"
  [milestones.text]
    de = "Modelle nutzen Werkzeuge aus angebundenen MCP-Servern – mit Rechteprüfung, Rückfrage vor heiklen Aufrufen und Anzeige im Chat. Dazu eingebaute Werkzeuge für Berechnungen und PDF-Blätter."
    en = "Models use tools from connected MCP servers – with permission checks, confirmation before sensitive calls and display in the chat. Plus built-in tools for calculations and PDF sheets."
  [milestones.note]
    de = "Werkzeugschleife mit höchstens 10 Runden, Rückfrage vor nicht freigegebenen Werkzeugen (auch nach Neuladen), Anzeige jedes Aufrufs im Chat. Seit 0.3.0: Import aus „mcpServers“-JSON, Online-Status je Server, Werkzeugtabelle mit Einstufung im Admin, MCP-Freigabe je Modell (kein, alle, ausgewählte; serverseitig geprüft) und das Werkzeug `run_python` in einer bubblewrap-Sandbox. Seit 0.3.1 das Werkzeug `create_pdf` für Arbeitsblätter, Briefe und Tabellen. MCP-Werkzeuge laufen auch mit lokalen Modellen über LM Studio. Seit 0.3.2 bekommt ein Modell bei vielen Werkzeugen nur einen Kern und sucht weitere mit `find_tools`; MultiGPT schätzt die Anfrage vor dem Senden und lässt notfalls ältere Nachrichten weg. Seit 0.3.5 sehen Verwalter offline MCP-Server live in der Statusleiste, seit 0.3.6 steht scipy in der Sandbox bereit."
    en = "Tool loop with at most 10 rounds, confirmation before unapproved tools (also after a reload), every call shown in the chat. Since 0.3.0: import from “mcpServers” JSON, online status per server, a tool table with classification in the admin, MCP access per model (none, all, selected; checked on the server) and the `run_python` tool in a bubblewrap sandbox. Since 0.3.1 the `create_pdf` tool for worksheets, letters and tables. MCP tools also work with local models via LM Studio. Since 0.3.2 a model with many tools gets only a core set and looks up more with `find_tools`; MultiGPT estimates the request before sending and drops older messages if needed. Since 0.3.5 administrators see offline MCP servers live in the status bar, and since 0.3.6 scipy is available in the sandbox."

  [[milestones.steps]]
    id = "M4a-01"
    status = "done"
    de = "Brücke zwischen Webserver und MCP"
    en = "Bridge between web server and MCP"

  [[milestones.steps]]
