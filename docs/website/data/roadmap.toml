  [milestones.text]
    de = "Markdown mit Code-Hervorhebung und Kopierknopf (Bibliotheken lokal eingebunden, Ausgabe bereinigt), Formeln mit KaTeX, SVG-Vorschau, automatische Chattitel, Umbenennen, Archiv, Löschen, Suche, Export als Markdown, System-Prompt pro Chat. Dazu Anhänge, Projekte und geteilte Chats."
    en = "Markdown with code highlighting and a copy button (libraries bundled locally, output sanitised), formulas with KaTeX, SVG preview, automatic chat titles, rename, archive, delete, search, Markdown export, system prompt per chat. Plus attachments, projects and shared chats."
  [milestones.note]
    de = "Abgeschlossen. Nachgezogen: eigene Nachrichten bearbeiten mit Versionen („‹ 1/2 ›“) und Kopierknopf. In 0.3.0 kamen Anhänge mit Bild-Eingabe (EXIF entfernt), Projekte mit Anweisungen, Standardmodell und Sammlungen, Chats teilen mit RWUD-Rechten sowie eine überarbeitete Oberfläche (Antworten in voller Breite, Seitenleiste ausblendbar, Schriftgröße A−/A+) dazu. Seit 0.3.2 folgt der Verlauf beim Schreiben nur noch, solange man unten ist; seit 0.3.4 holen Pfeil hoch/runter frühere Eingaben zurück, und eine Antwort lässt sich samt Frage und allem danach löschen; seit 0.3.5 gibt es ein persönliches Menü mit Profilbild; seit 0.3.6 Mitteilungen an den Besitzer geteilter Chats und die Versionsanzeige."
    en = "Complete. Follow-ups: editing your own messages with versions (“‹ 1/2 ›”) and a copy button. Version 0.3.0 added attachments with image input (EXIF removed), projects with instructions, default model and collections, chat sharing with RWUD permissions and a reworked interface (full-width answers, collapsible sidebar, font size A−/A+). Since 0.3.2 the history only follows a streaming answer while you are at the bottom; since 0.3.4 arrow up/down recalls earlier prompts, and an answer can be deleted together with its question and everything after it; since 0.3.5 there is a personal menu with a profile picture; since 0.3.6 notices to the owner of shared chats and the version display."

