[[milestones]]
  id = "7"
  status = "done"
  [milestones.title]
    de = "Eigene Dokumente (RAG)"
    en = "Your own documents (RAG)"
  [milestones.text]
    de = "Sammlungen, Upload, Indexierung im Hintergrund, Suche mit pgvector, Quellen mit Seitenangabe."
    en = "Collections, upload, background indexing, search with pgvector, sources with page numbers."
  [milestones.note]
    de = "Umgesetzt: Sammlungen mit Freigaben, Upload (PDF, DOCX, TXT, MD), Worker mit Wiederholung und OCR (Tesseract), Suche mit Zugriffsfilter in SQL und Volltext, Quellen mit Seitenzahl, Werkzeug für die Dokumentsuche und eine eigene RAG-Verwaltung im Admin. Embeddings lokal über LM Studio (nomic-embed-text, 768 Dimensionen), OCR mit olmOCR über LM Studio und Tesseract als Ersatz, beides im Admin per Knopf testbar; Verzeichnisquellen vom Server oder NAS, beschränkt auf `RAG_SOURCE_ROOTS` und periodisch eingelesen. Seit 0.3.0: Zitieren mit Abschnitt, Seite und Absatz in sechs Stilen samt Literaturangaben und Normen, Abbildungen per Vision-Modell beschrieben, Bilddateien als Dokument, die Dokument-Werkzeuge `list_documents`, `document_info` und `read_document`, Dokumente im Browser ansehen und Aufträge abbrechen. Seit 0.3.2 lädt MultiGPT lokale Modelle bei Bedarf selbst in LM Studio, nie über ein Speicherbudget; seit 0.3.4 bleiben die Modelle der Indexierung nur für den Lauf geladen; seit 0.3.5 werden mehrere Dokumente gleichzeitig indexiert; seit 0.3.6 lassen sich Läufe pausieren und fortsetzen."
    en = "Implemented: collections with sharing, upload (PDF, DOCX, TXT, MD), a worker with retries and OCR (Tesseract), search with access filtering in SQL plus full text, sources with page numbers, a document search tool and a dedicated RAG section in the admin. Embeddings locally via LM Studio (nomic-embed-text, 768 dimensions), OCR with olmOCR via LM Studio and Tesseract as a fallback, both testable with a button in the admin; directory sources from the server or NAS, limited to `RAG_SOURCE_ROOTS` and read in periodically. Since 0.3.0: citations with section, page and paragraph in six styles including bibliographic data and standards, figures described by a vision model, image files as documents, the document tools `list_documents`, `document_info` and `read_document`, viewing documents in the browser and cancelling jobs. Since 0.3.2 MultiGPT loads local models into LM Studio itself when needed, never beyond a memory budget; since 0.3.4 the indexing models stay loaded only for the run; since 0.3.5 several documents are indexed at once; since 0.3.6 runs can be paused and resumed."

