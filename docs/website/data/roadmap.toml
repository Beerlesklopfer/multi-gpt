[[milestones]]
  id = "12"
  status = "partial"
  [milestones.title]
    de = "Betrieb"
    en = "Operations"
  [milestones.text]
    de = "Worker-Unit, nginx-Beispiel mit TLS, Backup, vollständige Installationsanleitung, geprüftes Upgrade und Entfernen des Pakets."
    en = "Worker unit, nginx example with TLS, backup, complete installation guide, verified package upgrade and removal."
  [milestones.note]
    de = "Die Worker-Unit `multi-gpt-worker.service` liegt bereits im Paket. Die nginx-Site mit TLS ist ebenfalls im Paket: gunicorn lauscht nur auf localhost, Hostname und Zertifikat fragt debconf ab. Die Verwaltungsbefehle von `mgpt-ctl` sind im Wiki beschrieben, `debian/NEWS` nennt die Schritte nach einem Update. Offen: Backup, vollständige Anleitung sowie geprüftes Upgrade und Entfernen."
    en = "The worker unit `multi-gpt-worker.service` already ships in the package. The nginx site with TLS ships in the package as well: gunicorn listens on localhost only, and debconf asks for the host name and certificate. The `mgpt-ctl` admin commands are documented in the wiki, and `debian/NEWS` lists the steps after an update. Still open: backup, a complete guide and verified upgrade and removal."

[[milestones]]
  id = "13"
  status = "planned"
  [milestones.title]
    de = "Scratchpad"
    en = "Scratchpad"
  [milestones.text]
    de = "Material aus Chats, eigenen Dokumenten, dem Web, Werkzeugen, Bildern und Notizen sammeln, jeweils mit Herkunft und Zitierangabe, und daraus ein belegtes Gesamtdokument erzeugen. Das Modell schreibt nur aus den gesammelten Einträgen. Kurzbelege und Literaturverzeichnis setzt MultiGPT im gewählten Zitierstil, wörtliche Zitate werden gegen die Quelle geprüft. Export als Markdown, DOCX und PDF. Dazu ein Kontextmenü im Chat mit „Ins Scratchpad“, Nachfragen, Schnellaktionen und eigenen Prompt-Vorlagen."
    en = "Collect material from chats, your own documents, the web, tools, images and notes, each with its origin and citation data, and turn it into a fully referenced document. The model writes only from the collected entries. MultiGPT sets the in-text citations and the bibliography in the chosen citation style and checks verbatim quotes against the source. Export as Markdown, DOCX and PDF. Plus a context menu in the chat with “add to scratchpad”, follow-up questions, quick actions and your own prompt templates."
  [milestones.note]
    de = "Neu eingeplant. Das Kontextmenü und die Prompt-Vorlagen kommen zuerst, das Scratchpad dockt an die Projekte an."
    en = "Newly planned. The context menu and prompt templates come first; the scratchpad attaches to projects."

[[milestones]]
  id = "14"
  status = "planned"
  [milestones.title]
    de = "Runner"
    en = "Runner"
  [milestones.text]
    de = "Ein Container auf dem Rechner, an dem der Browser läuft – bevorzugt Podman rootless, Docker als Alternative. Der MultiGPT-Server verwaltet ihn per Kopplungs-Token (je Konto, nur gehasht gespeichert, widerrufbar, mit Ablauf). Der Runner verbindet sich nur ausgehend per WebSocket über TLS, am Client sind keine Ports offen. Für MultiGPT ist er ein MCP-Server mit Werkzeugen für Shell, Dateien, git und Python in `/workspace`; Einstufung, Rückfrage und MCP-Freigabe je Modell gelten wie gewohnt. Jede Sitzung lebt in einem eigenen Volume: Container sind wegwerfbar, Volumes werden im Web angelegt, begrenzt, gesichert und gelöscht. Abgerechnet wird über die neue Kontoart „Laufzeit“ in Container-Minuten je Rolle bzw. Person und Monat, mit Hinweis ab 80 % und Stopp ab 100 % – das Volume bleibt erhalten. Die Rolle legt Höchstwerte für CPU und RAM fest und ob der Container ins Netz darf; standardmäßig darf er es nicht. Im Web: Status, Starten, Stoppen, Zurücksetzen, Logs und ein Audit-Log aller Befehle."
    en = "A container on the computer the browser runs on – preferably rootless Podman, with Docker as an alternative. The MultiGPT server manages it via a pairing token (per account, stored only as a hash, revocable, with an expiry date). The runner connects outgoing only, via WebSocket over TLS; no ports are open on the client. To MultiGPT it is an MCP server with tools for shell, files, git and Python in `/workspace`; tool classification, confirmation and MCP access per model apply as usual. Every session lives in its own volume: containers are disposable, volumes are created, limited, backed up and deleted on the web. Usage is billed through the new “runtime” account type in container minutes per role or person and month, with a warning from 80 % and a stop at 100 % – the volume is kept. The role sets limits for CPU and RAM and whether the container may access the network; by default it may not. On the web: status, start, stop, reset, logs and an audit log of every command."
  [milestones.note]
    de = "Neu eingeplant. Zuerst gibt es nur Werkzeuge, keinen Coding-Agenten im Container. Offen ist noch, ob der Rückkanal als eigener ASGI-Dienst oder per Long-Polling läuft."
    en = "Newly planned. Tools come first; there is no coding agent inside the container. Still open: whether the back channel runs as a separate ASGI service or via long polling."
