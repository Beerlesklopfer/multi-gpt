    en = "The same question to several models, usage overview, monthly budgets and the “Family” admin page."
  [milestones.note]
    de = "Umgesetzt: Vergleichsmodus mit zwei oder drei Modellen, die Antworten als Versionen im Chat-Baum (Werkzeuge sind im Vergleich aus); Verbrauch und Monatsbudgets mit Hinweis ab 80 % und Sperre ab 100 % außer für kostenfreie Modelle; Seite „Mein Verbrauch“; Seite „Familie“ mit Konten, Rollen, Budgets und Gruppen sowie lesender Einsicht in Chats von Jugendlichen nur mit Option und dauerhaftem Hinweis. Seit 0.3.0 rechnet ein Kontenrahmen ab: Konten in Geld, nur Tokens oder als Pauschale, Preise mit Gültigkeit samt Cache und Reasoning, Wechselkurse, Buchungen und Budgets je Konto. Seit 0.3.4 nutzt MultiGPT das Prompt-Caching von Anthropic, seit 0.3.6 holt der Worker den EZB-Referenzkurs USD→EUR automatisch, und Konten in EUR lassen sich auf USD umstellen."
    en = "Implemented: comparison mode with two or three models, the answers stored as versions in the chat tree (tools are off in comparison); usage and monthly budgets with a warning from 80 % and a block from 100 % except for free models; a personal usage page; a “Family” page with accounts, roles, budgets and groups, plus read-only insight into teenagers' chats only with an option and a permanent notice. Since 0.3.0 billing runs through accounts: monetary, tokens only or flat rate, prices with validity dates including cache and reasoning, exchange rates, bookings and budgets per account. Since 0.3.4 MultiGPT uses Anthropic prompt caching; since 0.3.6 the worker fetches the ECB USD→EUR reference rate automatically, and EUR accounts can be switched to USD."

