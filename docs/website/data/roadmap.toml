[[milestones]]
  id = "14"
  status = "planned"
  [milestones.title]
    de = "Runner"
    en = "Runner"
  [milestones.text]
    de = "Ein Container auf dem Rechner, an dem der Browser läuft – bevorzugt Podman rootless, Docker als Alternative. Der MultiGPT-Server verwaltet ihn per Kopplungs-Token (je Konto, nur gehasht gespeichert, widerrufbar, mit Ablauf). Der Runner verbindet sich nur ausgehend per WebSocket über TLS, am Client sind keine Ports offen. Für MultiGPT ist er ein MCP-Server mit Werkzeugen für Shell, Dateien, git und Python in `/workspace`; Einstufung, Rückfrage und MCP-Freigabe je Modell gelten wie gewohnt. Jede Sitzung lebt in einem eigenen Volume: Container sind wegwerfbar, Volumes werden im Web angelegt, begrenzt, gesichert und gelöscht. Abgerechnet wird über die neue Kontoart „Laufzeit“ in Container-Minuten je Rolle bzw. Person und Monat, mit Hinweis ab 80 % und Stopp ab 100 % – das Volume bleibt erhalten. Die Rolle legt Höchstwerte für CPU und RAM fest und ob der Container ins Netz darf; standardmäßig darf er es nicht. Im Web: Status, Starten, Stoppen, Zurücksetzen, Logs und ein Audit-Log aller Befehle."
    en = "A container on the computer the browser runs on – preferably rootless Podman, with Docker as an alternative. The MultiGPT server manages it via a pairing token (per account, stored only as a hash, revocable, with an expiry date). The runner connects outgoing only, via WebSocket over TLS; no ports are open on the client. To MultiGPT it is an MCP server with tools for shell, files, git and Python in `/workspace`; tool classification, confirmation and MCP access per model apply as usual. Every session lives in its own volume: containers are disposable, volumes are created, limited, backed up and deleted on the web. Usage is billed through the new “runtime” account type in container minutes per role or person and month, with a warning from 80 % and a stop at 100 % – the volume is kept. The role sets limits for CPU and RAM and whether the container may access the network; by default it may not. On the web: status, start, stop, reset, logs and an audit log of every command."
  [milestones.note]
    de = "Neu eingeplant. Zuerst gibt es nur Werkzeuge, keinen Coding-Agenten im Container. Offen ist noch, ob der Rückkanal als eigener ASGI-Dienst oder per Long-Polling läuft."
    en = "Newly planned. Tools come first; there is no coding agent inside the container. Still open: whether the back channel runs as a separate ASGI service or via long polling."

