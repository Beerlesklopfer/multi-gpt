[[milestones]]
  id = "12"
  status = "planned"
  [milestones.title]
    de = "Betrieb"
    en = "Operations"
  [milestones.text]
    de = "Worker-Unit, nginx-Beispiel mit TLS, Backup, vollständige Installationsanleitung, geprüftes Upgrade und Entfernen des Pakets."
    en = "Worker unit, nginx example with TLS, backup, complete installation guide, verified package upgrade and removal."
  [milestones.note]
    de = "Die Worker-Unit `multi-gpt-worker.service` liegt bereits im Paket. Die nginx-Site mit TLS ist jetzt ebenfalls im Paket: gunicorn lauscht nur auf localhost, Hostname und Zertifikat fragt debconf ab. Offen: Backup, vollständige Anleitung sowie geprüftes Upgrade und Entfernen."
    en = "The worker unit `multi-gpt-worker.service` already ships in the package. The nginx site with TLS now ships in the package as well: gunicorn listens on localhost only, and debconf asks for the host name and certificate. Still open: backup, a complete guide and verified upgrade and removal."
