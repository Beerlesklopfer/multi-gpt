# Hugo-Konfiguration der Projektseite von MultiGPT.
# Bauen: hugo --source docs/website --minify   (Hugo-Version: siehe README.md)

# Eigene Domain auf GitHub Pages (CNAME multigpt → beerlesklopfer.github.io bei
# Hetzner, Domain unter Settings → Pages). Der Workflow setzt die baseURL beim
# Veröffentlichen ohnehin per --baseURL aus der Pages-Konfiguration.
baseURL = "https://multigpt.bernau.family/"

title = "MultiGPT"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

# Nur die Seiten, die wir wirklich brauchen: kein RSS, keine Taxonomien.
disableKinds = ["rss", "taxonomy", "term"]

enableRobotsTXT = true
# Hugo soll keine eigenen Meta-Generator-Tags einfügen.
disableHugoGeneratorInject = true

[params]
  # GitHub-Repository und Lizenz (LICENSE im Repository).
  repoURL = "https://github.com/Beerlesklopfer/multi-gpt"
  license = "AGPL-3.0-or-later"

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    contentDir = "content/de"
    weight = 1
    [languages.de.params]
      description = "Selbst gehostetes Multi-KI-Chatsystem für Familie und Haushalt: eigene Daten, viele Anbieter, ein Chat."
  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    [languages.en.params]
      description = "Self-hosted multi-AI chat system for families and households: your own data, many providers, one chat."

[markup]
  [markup.goldmark.renderer]
    # Kein rohes HTML aus Markdown; Inhalte bleiben reines Markdown.
    unsafe = false
  [markup.highlight]
    # Keine Syntaxfarben: Codeblöcke als schlichtes <pre><code>, ohne Inline-Styles.
    codeFences = false

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false

[sitemap]
  changeFreq = "monthly"
