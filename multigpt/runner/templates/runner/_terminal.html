{# Terminal im Browser (8p): xterm.js, Strom über MultiGPT (runner_terminal.js). Ausgaben sind nicht vertrauenswürdig – xterm zeigt sie nur als Text. #}
<section class="runner-terminal" id="runner-terminal" aria-label="Terminal der Sitzung" hidden>
  <div class="runner-terminal-bar">
    <span class="runner-terminal-state" data-runner-terminal-state role="status" aria-live="polite"></span>
    <button type="button" class="button button-small" data-runner-terminal-close>Terminal schließen</button>
  </div>
  <div class="runner-terminal-screen" data-runner-terminal-screen></div>
  <p class="hint">Tastatur: Fokus ins Terminal setzen; Esc und Tab gehen an das Programm. Mit Strg+Umschalt+F6 (oder dem Knopf) verlässt du das Terminal.</p>
</section>
