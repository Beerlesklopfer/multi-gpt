{% extends "base.html" %}
{% block title %}Passwort ändern – MultiGPT{% endblock %}
{% block inhalt %}
  <section class="seite">
    <h1>Passwort ändern</h1>
    <form method="post" action="{% url 'password_change' %}" class="formular">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="knopf knopf-primaer">Passwort ändern</button>
      <a href="{% url 'chat:index' %}" class="knopf">Abbrechen</a>
    </form>
  </section>
{% endblock %}
