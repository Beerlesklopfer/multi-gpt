{% extends "base.html" %}
{% block title %}Passwort ändern – MultiGPT{% endblock %}
{% block content %}
  <section class="page">
    <h1>Passwort ändern</h1>
    <form method="post" action="{% url 'password_change' %}" class="form">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="button button-primary">Passwort ändern</button>
      <a href="{% url 'chat:index' %}" class="button">Abbrechen</a>
    </form>
  </section>
{% endblock %}
