{% extends "admin/change_list.html" %}
{# Wechselkurse: optional Knopf „EZB-Kurs abrufen“ (nur mit BILLING_ECB_FETCH=true). #}
{% block object-tools-items %}
  {% if ecb_enabled %}
    <li>
      <form method="post" action="{% url 'admin:billing_exchangerate_fetch_ecb' %}">
        {% csrf_token %}
        <button type="submit" class="button">EZB-Kurs abrufen</button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
